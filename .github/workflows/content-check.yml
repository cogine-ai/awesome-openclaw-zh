name: Content catalog
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify catalog, documents and generated counts
        run: python3 scripts/generate-index.py --check
      - name: Verify failure detection
        run: python3 -m unittest discover -s tests
