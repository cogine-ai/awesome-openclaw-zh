<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="口播离线规划"><rect width="1200" height="630" fill="#f1f5ee"/><g font-family="system-ui,sans-serif"><text x="50" y="68" font-size="22" fill="#376b50">OPCBOOST / 离线制作准备</text><text x="50" y="135" font-size="46" font-weight="700" fill="#173f30">3段口播，26秒文字估时。</text><rect x="50" y="180" width="1100" height="84" rx="14" fill="#fff" stroke="#bdcebf"/><text x="76" y="215" font-size="25" fill="#173f30">00–09s · 720p · 口播 s1</text><text x="76" y="248" font-size="19" fill="#526655">想试试龙虾，却不知道从哪里开始？在 OPCBoost，先看真实成果，再选适合自己的案例。</text><rect x="50" y="280" width="1100" height="84" rx="14" fill="#fff" stroke="#bdcebf"/><text x="76" y="315" font-size="25" fill="#173f30">09–17s · 480p · 口播 s2</text><text x="76" y="348" font-size="19" fill="#526655">经验卡、手绘项目战报、原创分镜，每篇说明来源、运行条件，以及实际验证到了哪一步。</text><rect x="50" y="380" width="1100" height="84" rx="14" fill="#fff" stroke="#bdcebf"/><text x="76" y="415" font-size="25" fill="#173f30">17–26s · 720p · 口播 s3</text><text x="76" y="448" font-size="19" fill="#526655">下载输入和复现脚本，换成自己的内容再跑一次。Cogine 团队邀请你带着真实成果参与共建。</text><text x="50" y="555" font-size="23" fill="#526655">实际脚本产物 · 计划字幕 · 任务草稿</text><text x="50" y="596" font-size="21" fill="#8b4f14">未生成主播、声音或视频 · 价格未知</text></g></svg>
