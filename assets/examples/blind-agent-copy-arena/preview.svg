<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="预置文案匿名评分演练"><rect width="1200" height="630" fill="#f1f5ee"/><g font-family="system-ui,sans-serif"><text x="50" y="68" font-size="22" fill="#376b50">OPCBOOST / 原创交互演练</text><text x="50" y="135" font-size="46" font-weight="700" fill="#173f30">先打分，再揭晓写法。</text><rect x="50" y="174" width="1100" height="86" rx="14" fill="#ffffff" stroke="#bdcebf"/><text x="76" y="210" font-size="25" fill="#173f30">A · 从一份真实输入开始，跟着案例把想法变成能打开的成果。</text><rect x="50" y="279" width="1100" height="86" rx="14" fill="#ffffff" stroke="#bdcebf"/><text x="76" y="315" font-size="25" fill="#173f30">B · 想试龙虾？先看案例验证到哪一步，再下载材料亲手复现。</text><rect x="50" y="384" width="1100" height="86" rx="14" fill="#ffffff" stroke="#bdcebf"/><text x="76" y="420" font-size="25" fill="#173f30">C · 先看做出来的作品，再选你的第一个龙虾案例。</text><text x="50" y="555" font-size="23" fill="#526655">预置候选 · 具体 / 可信 / 行动 · 每项0–5分</text><text x="50" y="596" font-size="21" fill="#8b4f14">未执行原生Agent盲测，不构成模型排行</text></g></svg>
