<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#eff5ef"/><g font-family="system-ui,sans-serif"><text x="64" y="68" font-size="20" fill="#267051">COGINE · BIGARROW v0.5.1</text><text x="64" y="135" font-size="43" font-weight="700" fill="#12372b">把说明变成三张桌面教学卡</text><text x="64" y="178" font-size="22" fill="#526c60">看成果、选路线、准备输入，再动手制作</text><rect x="64" y="222" width="366" height="348" rx="22" fill="white" stroke="#c2d8ca"/><text x="88" y="275" font-size="29" font-weight="700" fill="#146447">1 看成果</text><rect x="86" y="309" width="322" height="48" rx="10" fill="#edf5ef"/><text x="101" y="341" font-size="23" fill="#224d3a">打开公开经验卡</text><rect x="86" y="377" width="322" height="48" rx="10" fill="#edf5ef"/><text x="101" y="409" font-size="23" fill="#224d3a">对照 v1 / v2</text><rect x="86" y="445" width="322" height="48" rx="10" fill="#edf5ef"/><text x="101" y="477" font-size="23" fill="#224d3a">你来点击与确认</text><rect x="454" y="222" width="366" height="348" rx="22" fill="white" stroke="#c2d8ca"/><text x="478" y="275" font-size="29" font-weight="700" fill="#146447">2 选路线</text><rect x="476" y="309" width="322" height="48" rx="10" fill="#edf5ef"/><text x="491" y="341" font-size="23" fill="#224d3a">离线重放</text><rect x="476" y="377" width="322" height="48" rx="10" fill="#edf5ef"/><text x="491" y="409" font-size="23" fill="#224d3a">真实访谈</text><rect x="476" y="445" width="322" height="48" rx="10" fill="#edf5ef"/><text x="491" y="477" font-size="23" fill="#224d3a">说明模型与账号门槛</text><rect x="844" y="222" width="366" height="348" rx="22" fill="white" stroke="#c2d8ca"/><text x="868" y="275" font-size="29" font-weight="700" fill="#146447">3 查条件</text><rect x="866" y="309" width="322" height="48" rx="10" fill="#edf5ef"/><text x="881" y="341" font-size="23" fill="#224d3a">使用公开输入</text><rect x="866" y="377" width="322" height="48" rx="10" fill="#edf5ef"/><text x="881" y="409" font-size="23" fill="#224d3a">检查 Python